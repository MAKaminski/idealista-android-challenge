name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # JDK 17 is what the build targets; the foojay resolver would provision a
      # toolchain anyway, but installing it here keeps the build off that path.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # AGP 9.3.1 needs platform 37.1; build-tools it installs itself on demand.
      - name: Install SDK platform
        run: sdkmanager "platforms;android-37.1" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lint, unit tests, debug APK
        run: ./gradlew lint testDebugUnitTest assembleDebug --stacktrace

      # Uploaded even on failure — a red build's reports are the useful ones.
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          retention-days: 14
          if-no-files-found: ignore

      # Download this from the run summary to sideload without building locally.
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
