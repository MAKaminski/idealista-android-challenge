# 1g metaspace is not enough once KSP, Hilt and Room codegen all run in one build - the
# daemon expires mid-build and restarts, costing a full cold configuration next time.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.nonTransitiveRClass=true
android.disallowKotlinSourceSets=false

# Verified working with this module graph (KSP + Hilt + Room) on 2026-07-27.
org.gradle.configuration-cache=true
